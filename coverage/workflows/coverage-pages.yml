name: coverage-pages

# Publishes the YANG coverage dashboard (coverage/site + the
# committed coverage/data/coverage.json) to GitHub Pages.
# CI only publishes — the JSON is generated locally and committed
# (see coverage/README.md "Refresh procedure").

on:
  push:
    branches: [main]
    paths:
      - "coverage/**"
      - "yang-learn/corpus/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: coverage-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp coverage/site/index.html coverage/site/style.css coverage/site/app.js _site/
          cp coverage/data/coverage.json _site/data/coverage.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
